<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研序</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar drag-region">
    <div class="brand no-drag">
      <img src="../../Resources/AppIcon-source.png" alt="研序">
      <div><strong>研序 <em id="brand-mode">科研模式</em></strong><span id="full-date"></span></div>
    </div>
    <div class="top-actions no-drag">
      <button class="header-button" id="settings-open" title="设置">
        <span data-icon="settings"></span>
        <b>设置</b>
      </button>
      <button class="header-button" id="deadline-manage"><span data-icon="flag"></span><b>里程碑与 DDL · <i id="ddl-count">0</i></b></button>
      <button class="header-button" id="records-open"><span data-icon="chart"></span><b>详细记录</b></button>
      <div class="window-controls">
        <button data-window="minimize" aria-label="最小化" data-icon="minus"></button>
        <button data-window="maximize" aria-label="最大化" data-icon="maximize"></button>
        <button data-window="close" class="close" aria-label="关闭" data-icon="close"></button>
      </div>
    </div>
  </header>

  <section class="dashboard" id="dashboard"></section>

  <main class="workspace">
    <aside class="panel today-panel">
      <div class="panel-title today-title">
        <div><h2>今天</h2><span id="today-date"></span></div>
        <div class="today-tools"><small id="today-progress"></small><button class="outline-button" id="new-task"><span data-icon="plus"></span>新建</button></div>
      </div>
      <div class="quick-add"><span data-icon="plus"></span><input id="quick-input" placeholder="试试：明天下午 2 点开会"><em id="quick-preview"></em><kbd>Enter</kbd></div>
      <div class="today-scroll" id="today-list"></div>
    </aside>

    <section class="panel calendar-panel">
      <div class="calendar-toolbar">
        <div class="calendar-nav">
          <button id="calendar-prev" aria-label="上一页" data-icon="chevronLeft"></button>
          <button id="calendar-next" aria-label="下一页" data-icon="chevronRight"></button>
          <button id="calendar-today">今天</button>
          <h2 id="calendar-title"></h2>
        </div>
        <div class="calendar-actions">
          <div class="segmented"><button data-view="week" class="active">周</button><button data-view="month">月</button></div>
          <button class="outline-button" id="inbox-drawer"><span data-icon="tray"></span>待安排</button>
          <button class="primary-button" id="calendar-new"><span data-icon="plus"></span>新建</button>
        </div>
      </div>
      <div id="calendar-body" class="calendar-body"></div>
    </section>

    <aside class="right-rail" id="right-rail"></aside>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="inbox-drawer" id="inbox-panel">
    <div class="drawer-title"><div><h2>待安排</h2><p>把任务拖到日历中的某一天</p></div><button data-close-drawer data-icon="close" aria-label="关闭"></button></div>
    <div id="drawer-list" class="drawer-list"></div>
  </aside>

  <div class="modal-layer" id="modal-layer" aria-hidden="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div class="task-context-menu" id="task-context-menu" role="menu" aria-hidden="true"></div>
  <div class="toast" id="toast"></div>

  <script src="../shared/workspace-modes.js"></script>
  <script src="../shared/quick-parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
